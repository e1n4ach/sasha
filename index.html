<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eac2cc" />
    <meta name="description" content="Дорогая, приглашаю тебя на празднование в субботу, в 15:00 ♥" />
    <title>Для тебя, дорогая ♥</title>
    <link rel="icon" href="./assets/heart.svg" type="image/svg+xml" />
    <link rel="preload" href="./assets/MarckScript-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="lace lace--left" aria-hidden="true"></div>
    <div class="lace lace--right" aria-hidden="true"></div>

    <main>
      <article class="invitation" aria-labelledby="invitation-title">
        <div class="card-border" aria-hidden="true"></div>

        <svg class="bow" viewBox="0 0 120 64" fill="none" aria-hidden="true">
          <path d="M58 29C43 9 16 4 15 18c-1 13 26 17 43 11ZM62 29C77 9 104 4 105 18c1 13-26 17-43 11Z" />
          <path d="M56 31C44 33 37 47 31 54c10-1 17-5 22-12M64 31c12 2 19 16 25 23-10-1-17-5-22-12M58 25c-4 1-4 9 0 11 5 2 8-1 7-6-1-4-3-6-7-5Z" />
        </svg>

        <h1 id="invitation-title">Дорогая,</h1>
        <p class="message">приглашаю тебя<br />на празднование<br /><em>в субботу</em></p>

        <div class="divider" aria-hidden="true"><span>✧</span></div>

        <p class="meeting">Буду ждать тебя у тебя</p>
        <p class="time"><span>в</span> <time datetime="15:00">15:00</time></p>

        <p class="love">Люблю тебя</p>
        <button class="heart" type="button" aria-label="Сердечко для тебя" aria-describedby="heart-note">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 41S5 29 5 16.5C5 6 18 3 24 13 30 3 43 6 43 16.5 43 29 24 41 24 41Z" /></svg>
        </button>
        <p class="heart-note" id="heart-note" aria-live="polite">это сердечко — тебе</p>
      </article>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
